name: Deploy MediFlow Web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - 'server/**'
      - 'testing/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate and Build Web Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22 for Vite 8 compatibility)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Run client linter
        run: npm --prefix client run lint

      - name: Build client for GitHub Pages
        run: |
          npm --prefix client run build
          cp client/dist/index.html client/dist/404.html
        env:
          GITHUB_PAGES: 'true'
          VITE_BASE_PATH: '/mediflow/'
          VITE_API_URL: 'https://mediflow-web-3q7j.onrender.com/api'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  test-and-audit:
    name: Multi-Stage Testing & QA Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        run: npm install

      - name: Install test tools (Selenium, Autocannon, ExcelJS)
        run: npm install --no-save selenium-webdriver autocannon exceljs

      - name: Build local client for in-memory server testing
        run: |
          npm --prefix client ci
          npm --prefix client run build
        env:
          VITE_BASE_PATH: '/'

      - name: Start local test server
        run: |
          PORT=5000 node server/index.js &
          echo $! > /tmp/mediflow_server.pid
          READY=0
          for i in $(seq 1 30); do
            if curl -s http://localhost:5000/api/health > /dev/null; then
              echo "✅ Local test server ready on port 5000"
              READY=1
              break
            fi
            echo "Waiting for server to start... ($i/30)"
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "❌ Fatal: Local test server failed to start on port 5000 within 30 seconds."
            exit 1
          fi
        env:
          PORT: 5000
          NODE_ENV: test
          DATABASE_URL: ''

      - name: 1. DAST Security & Hardening Audit
        run: node testing/Web/Vulnerability-Testing/SecurityTestRunner.js
        env:
          BASE_URL: http://localhost:5000

      - name: 2. Selenium Web UI Automation (Headless Chrome)
        run: node testing/Web/Selenium/SeleniumTestRunner.js
        env:
          BASE_URL: http://localhost:5000

      - name: 3. Controlled Local Load & Latency Benchmark
        run: node testing/Web/Load-Testing/LoadTestRunner.js
        env:
          BASE_URL: http://localhost:5000

      - name: 4. Appium Mobile Contract Audit (Explicit Skip Reporting)
        run: node testing/Android/Appium/AppiumTestRunner.js
        env:
          BASE_URL: http://localhost:5000

      - name: 5. Generate 5 QA Excel Workbooks
        run: node testing/generate_5_reports.js

      - name: Stop local test server
        if: always()
        run: |
          if [ -f /tmp/mediflow_server.pid ]; then
            kill $(cat /tmp/mediflow_server.pid) 2>/dev/null || true
            rm -f /tmp/mediflow_server.pid
          fi

      - name: Upload Test Reports & Execution Logs (Always Run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediflow-test-reports
          path: |
            testing/*.xlsx
            testing/**/*.json

  deploy:
    name: Deploy Web to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [validate-and-build, test-and-audit]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
